<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img"><title>Frontend and backend</title><desc>Frontend 1419. The screen. TypeScript and React. Backend 300. The API on the other side of that screen.</desc><rect width="640" height="260" rx="24" fill="#F6F3EC" stroke="#E6DCCB"/><text x="28" y="56" fill="#1C1915" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Frontend</text><text x="612" y="56" fill="#1B7A45" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="end">1,419</text><text x="28" y="84" fill="#5E584E" font-family="Segoe UI, Arial, sans-serif" font-size="16">The screen. TypeScript and React.</text><rect x="28" y="100" width="584" height="14" rx="7" fill="#E7E0D4"/><rect x="28" y="100" width="584" height="14" rx="7" fill="#1B7A45"/><text x="28" y="174" fill="#1C1915" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Backend</text><text x="612" y="174" fill="#1B7A45" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="end">300</text><text x="28" y="202" fill="#5E584E" font-family="Segoe UI, Arial, sans-serif" font-size="16">The API on the other side of that screen.</text><rect x="28" y="218" width="584" height="14" rx="7" fill="#E7E0D4"/><rect x="28" y="218" width="123" height="14" rx="7" fill="#1B7A45"/></svg>