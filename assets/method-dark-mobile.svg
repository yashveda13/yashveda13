<rect x="24" y="24" width="592" height="76" rx="18" fill="#163222"/><text x="48" y="56" fill="#6EE7A8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">01</text><text x="48" y="80" fill="#F4F1EA" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Read the screen</text><rect x="24" y="116" width="592" height="76" rx="18" fill="#163222"/><text x="48" y="148" fill="#6EE7A8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">02</text><text x="48" y="172" fill="#F4F1EA" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Name the case</text><rect x="24" y="208" width="592" height="76" rx="18" fill="#163222"/><text x="48" y="240" fill="#6EE7A8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">03</text><text x="48" y="264" fill="#F4F1EA" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Write the test</text>
