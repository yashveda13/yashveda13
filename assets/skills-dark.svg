<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="268" viewBox="0 0 1040 268" role="img"><title>Frontend and backend</title><desc>Frontend 1419. The screen. TypeScript and React. Backend 300. The API on the other side of that screen.</desc><rect width="1040" height="268" rx="24" fill="#171D19" stroke="#2A332C"/><text x="32" y="60" fill="#F4F1EA" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Frontend</text><text x="1008" y="60" fill="#6EE7A8" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="end">1,419</text><text x="32" y="88" fill="#A39B90" font-family="Segoe UI, Arial, sans-serif" font-size="16">The screen. TypeScript and React.</text><rect x="32" y="106" width="976" height="16" rx="8" fill="#243028"/><rect x="32" y="106" width="976" height="16" rx="8" fill="#6EE7A8"/><text x="32" y="180" fill="#F4F1EA" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Backend</text><text x="1008" y="180" fill="#6EE7A8" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="end">300</text><text x="32" y="208" fill="#A39B90" font-family="Segoe UI, Arial, sans-serif" font-size="16">The API on the other side of that screen.</text><rect x="32" y="226" width="976" height="16" rx="8" fill="#243028"/><rect x="32" y="226" width="206" height="16" rx="8" fill="#6EE7A8"/></svg>