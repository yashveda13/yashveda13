<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1340" viewBox="0 0 640 1340" role="img">
<title>What I can build</title>
<desc>01 A finished interview. The question, the answer, the score, and the feedback. An unfinished session shows no score. 02 A coding round. The editor, the output, and a way back to the feedback. A spoken question does not open the editor. 03 Mail for one job. A note that names the job stays. A note that does not is dropped. A later note on that thread stays. 04 A page that stays. Scroll, the header, and a phone. Coming back from a coding question does not land on the wrong page. 05 Resume beside a job. The resume, the job beside it, and a result you can check. A resume alone is not a match. 06 The API and the test. The route that returns the number, and a test for the other case. Covering only the case that stays is not done.</desc>
